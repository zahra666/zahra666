<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#47b79d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="井井有条">
<title>井井有条</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{--g:#47b79d;--g2:#2f9c84;--gd:#1f7d69;--bg:#eef7f2;--card:#fff;--tx:#23332e;--sub:#8a9a94;--red:#e5604f;--org:#f2994a;--yel:#e8b630;--line:#e6efea}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#dfe9e4;color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif}
header{position:relative}
#bell{position:absolute;right:14px;top:calc(env(safe-area-inset-top) + 9px);width:38px;height:38px;border-radius:50%;background:#ffffff2e;font-size:20px;display:grid;place-items:center}
#bell em{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font:700 11px/18px sans-serif;font-style:normal}
.al{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.al .ae{font-size:28px;width:36px;text-align:center}.al div{flex:1;min-width:0}.al b{display:block;font-size:16px}.al small{font-size:13px;color:var(--sub)}.al small.r{color:var(--red);font-weight:600}.al small.o{color:#d9741b;font-weight:600}
.al button{background:#dff3ea;color:var(--g2);padding:8px 13px;border-radius:14px;font-weight:600;font-size:14px}
.me select{border:0;background:#edf3f0;border-radius:10px;padding:5px 8px;color:var(--tx)}
.note{font-size:12px;color:var(--sub);line-height:1.7;padding:0 16px 12px}
button,input,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0}
#app{position:relative;height:100dvh;max-width:480px;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 40px #0002}
header{background:var(--g);color:#fff;text-align:center;font-size:19px;font-weight:600;padding:calc(env(safe-area-inset-top) + 14px) 0 14px;letter-spacing:2px}
#banner{position:relative;display:flex;justify-content:space-between;align-items:center;padding:14px 18px 22px;color:#fff;background:linear-gradient(100deg,var(--g) 0%,#7fd0b8 55%,#f3c98d 100%)}
#banner:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:12px;background:var(--bg);border-radius:60% 60% 0 0/100% 100% 0 0}
#banner b.t{font-size:18px;letter-spacing:1px}
#banner .n{font-size:38px;font-weight:800;color:#f58a3c;font-style:italic;line-height:1}
#banner .n small{font-size:14px;margin-left:3px;color:#fff;font-weight:500;font-style:normal}
#hint{display:flex;align-items:center;gap:8px;padding:6px 14px 8px;font-size:13px;color:#8a6d1c;background:var(--bg)}
#hint span{flex:1}
#hint button{font-size:18px;color:#8a6d1c;padding:0 4px}
#body{position:relative;flex:1;min-height:0;display:flex}
#rail{width:76px;flex:none;overflow-y:auto;padding:8px 4px 90px;background:#e3f2ea;scrollbar-width:none}
#rail::-webkit-scrollbar{display:none}
.ri{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;width:100%;padding:8px 0 7px;margin-bottom:6px;border-radius:20px;font-size:12px;color:var(--sub)}
.ri .ic{position:relative;width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:24px}
.ri.on{background:#fff;color:var(--g2);font-weight:600;box-shadow:0 2px 10px #0001}
.ri .bd{position:absolute;top:-4px;right:-6px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--org);color:#fff;font-size:11px;line-height:18px;font-weight:700}
#main{flex:1;min-width:0;overflow-y:auto;padding:6px 12px 110px}
.hd{display:flex;justify-content:space-between;align-items:baseline;margin:6px 4px 10px}
.hd h2{margin:0;font-size:21px;color:var(--gd)}
.hd span,.hd button{font-size:13px;color:var(--sub)}
.hd button.pill{color:var(--g2);background:#fff;border-radius:14px;padding:5px 11px;font-weight:600;box-shadow:0 1px 6px #0001}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 11px;border-radius:14px;font-size:13px;color:var(--sub)}
.chip i{font-style:normal;font-size:22px}
.chip.on{background:#dcefe5;color:var(--g2);font-weight:600}
.chips.flat .chip{flex-direction:row;gap:4px;padding:6px 12px;background:#fff;border-radius:16px}
.chips.flat .chip.on{background:var(--g);color:#fff}
.card{display:flex;align-items:stretch;background:var(--card);border-radius:20px;margin-bottom:12px;box-shadow:0 2px 10px #2f9c8412;overflow:hidden}
.card .ico{flex:none;width:50px;display:grid;place-items:center;font-size:32px;padding-left:10px}
.card .info{flex:1;min-width:0;padding:14px 10px 14px 12px;cursor:pointer}
.card .info b{display:block;font-size:17px;margin-bottom:5px}
.card .info small{display:block;color:var(--sub);font-size:13px;line-height:1.5}
.card .info small.warn{color:var(--red);font-weight:600}
.card .side{flex:none;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;padding:10px 0 10px 4px}
.badge{padding:3px 11px;border-radius:12px 0 0 12px;font-size:13px;font-weight:600;background:#dff3ea;color:var(--g2);white-space:nowrap}
.badge.o{background:#ffe9d3;color:#d9741b}.badge.r{background:#fde1dc;color:var(--red)}.badge.y{background:#fbf1cb;color:#a98100}
.check{flex:none;width:62px;border-left:1px solid var(--line);display:grid;place-items:center;color:var(--g);font-size:28px}
.check:active{background:#dff3ea}
.stepper{display:flex;align-items:center;gap:12px;padding-right:14px}
.stepper button{width:40px;height:34px;border-radius:12px;font-size:22px;font-weight:700;line-height:1}
.stepper .m{background:#fdecea;color:var(--red)}.stepper .p{background:#dff3ea;color:var(--g2)}
.stepper .q{min-width:26px;text-align:center;font-size:27px;font-weight:800;color:var(--g2)}
.stepper .q.low{color:var(--red)}
.stepper.sm .q{font-size:22px}
.eat{align-self:center;margin-right:12px;background:#fff1de;color:#d9741b;padding:8px 12px;border-radius:14px;font-size:14px;font-weight:600}
.sec{margin:14px 4px 8px;font-size:14px;color:var(--sub);font-weight:600}
.empty{text-align:center;color:var(--sub);padding:40px 0;font-size:14px;line-height:1.8}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:10px}
.tile{background:#fff;border-radius:14px;text-align:center;padding:8px 0;font-size:12px;color:var(--sub)}
.tile b{display:block;font-size:20px;color:var(--g2)}
.tile.now{outline:2px solid var(--g)}
fab,.fab{position:absolute;right:14px;bottom:16px;width:54px;height:54px;border-radius:50%;background:#fff;border:2px solid var(--g);color:var(--g);font-size:34px;line-height:1;box-shadow:0 4px 14px #0002;display:grid;place-items:center;z-index:5;padding-bottom:3px}
nav{display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:12px;color:#aab6b1}
nav button i{font-style:normal;font-size:24px;filter:grayscale(1) opacity(.55)}
nav button.on{color:var(--g2);font-weight:600}
nav button.on i{filter:none}
#mask{position:absolute;inset:0;background:#0006;z-index:20;display:none;align-items:flex-end}
#mask.show{display:flex}
#sheet{width:100%;max-height:88%;overflow-y:auto;background:#fff;border-radius:24px 24px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom) + 18px);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
#sheet h3{margin:0 0 14px;font-size:19px;color:var(--gd)}
.f{margin-bottom:13px}.f label{display:block;font-size:13px;color:var(--sub);margin-bottom:5px}
.f input,.f select{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fafdfb;outline:none}
.f input:focus,.f select:focus{border-color:var(--g)}
.pre{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.pre button{padding:5px 11px;border-radius:12px;background:#e8f5ee;color:var(--g2);font-size:13px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns{display:flex;gap:10px;margin-top:6px}
.btns button{flex:1;padding:13px;border-radius:14px;font-weight:600;font-size:16px}
.btns .ok{background:var(--g);color:#fff}.btns .cancel{background:#edf3f0;color:var(--sub)}.btns .del{background:#fdecea;color:var(--red);flex:none;padding:13px 18px}
#toast{position:absolute;left:50%;bottom:84px;transform:translateX(-50%);background:#23332ee6;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:30;display:none;align-items:center;gap:12px;white-space:nowrap}
#toast.show{display:flex}#toast button{color:#8fe3c9;font-weight:700}
.me .card{padding:6px 0;flex-direction:column}
.me .line{display:flex;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);font-size:15px}
.me .line:last-child{border:0}
.me .line span{color:var(--sub)}
.me button.line{width:100%;text-align:left}
.me button.line.danger{color:var(--red)}
.list-txt{white-space:pre-wrap;background:#f4faf7;border-radius:12px;padding:12px;font-size:15px;line-height:1.8;margin-bottom:12px}
</style>
</head>
<body>
<div id="app">
  <header><span id="title">生活</span><button id="bell" data-act="bell">🔔<em id="bn"></em></button></header>
  <div id="banner"></div>
  <div id="hint"></div>
  <div id="body">
    <div id="rail"></div>
    <div id="main"></div>
    <button class="fab" id="fab" data-act="add">+</button>
  </div>
  <nav id="tabs"></nav>
  <div id="mask"><div id="sheet"></div></div>
  <div id="toast"></div>
</div>

<script>
/* ============ 工具 ============ */
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9);
const pad = n => String(n).padStart(2, '0');
const fmt = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => fmt(new Date());
const diff = (a, b) => Math.round((parse(a) - parse(b)) / 864e5);
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return fmt(d); };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ============ 常量 ============ */
const ROOMS = [['厨房', '🍳', '#fde6cf'], ['客厅', '🛋️', '#d9f1e6'], ['卧室', '🛏️', '#e5dcf6'], ['卫浴', '🛁', '#dbe8fb'], ['全屋', '🏠', '#d2eddc'], ['阳台', '🧺', '#fff0c9'], ['宠物', '🐱', '#fddccd'], ['花草', '🪴', '#dff3d3']];
const STOCK_CATS = [['厨房', '🍳'], ['日耗', '🧻'], ['清洁', '🧴'], ['个护', '🪥'], ['宠物', '🐾'], ['母婴', '👶'], ['其他', '📎']];
const WEAR_TYPES = [['上衣', '👕'], ['裤子', '👖'], ['裙子', '👗'], ['外套', '🧥'], ['鞋子', '👟'], ['袜子内衣', '🧦'], ['配饰', '🧣']];
const SEASONS = ['春', '夏', '秋', '冬', '四季'];
const SUBS = ['短袖', '长袖', '无袖', '衬衫', '卫衣', '毛衣', '短裤', '长裤', '牛仔裤', '运动裤', '羽绒服', '风衣', '运动鞋', '板鞋', '凉鞋', '靴子', '拖鞋'];
const KEY = 'jjyt_v1';
const DEF_SET = { notify: true, hour: 9, lastRemind: '' };

/* ============ 数据 ============ */
function seed() {
  const t = today(), ago = n => addDays(t, -n);
  const C = (room, name, note, emoji, every, last) => ({ id: uid(), room, name, note, emoji, every, last: ago(last) });
  const S = (cat, name, emoji, qty, min, unit) => ({ id: uid(), cat, name, emoji, qty, min, unit });
  const F = (name, emoji, qty, unit, exp) => ({ id: uid(), name, emoji, qty, unit, expire: addDays(t, exp) });
  const W = (type, name, season, sub, qty, color) => ({ id: uid(), type, name, season, sub, qty, color });
  return {
    hintOff: false, settings: { ...DEF_SET },
    chores: [
      C('厨房', '洗碗 · 擦灶台', '饭后顺手做', '🍽️', 1, 1), C('厨房', '倒垃圾', '厨余垃圾别过夜', '🗑️', 1, 0),
      C('厨房', '清理冰箱过期食物', '扔掉过期的，擦一擦隔层', '🧊', 7, 5), C('厨房', '深度清洁油烟机', '', '♨️', 30, 20),
      C('客厅', '扫地拖地', '', '🧹', 3, 3), C('客厅', '擦桌面 · 茶几', '', '🧽', 7, 8), C('客厅', '吸尘沙发', '', '🛋️', 14, 6),
      C('卧室', '整理床铺', '', '🛏️', 1, 0), C('卧室', '换洗床单被套', '', '🧺', 14, 15), C('卧室', '晒被子', '天气好的时候', '☀️', 30, 12),
      C('卫浴', '刷马桶', '', '🚽', 7, 7), C('卫浴', '洗衣服', '', '👚', 3, 2), C('卫浴', '清洗洗衣机槽', '', '🌀', 30, 10), C('卫浴', '更换毛巾', '', '🧖', 7, 4),
      C('全屋', '扫地机清空尘盒', '', '🤖', 7, 3), C('全屋', '擦窗户', '', '🪟', 90, 40), C('全屋', '清洗空调滤网', '', '❄️', 90, 70),
      C('阳台', '收衣服 · 叠衣服', '', '👕', 1, 1),
      C('宠物', '清洗猫碗/水碗', '热水清洗，避免细菌滋生', '🥣', 3, 1), C('宠物', '更换猫砂', '彻底更换并清洗猫砂盆', '🧹', 14, 10),
      C('宠物', '宠物驱虫', '体内外驱虫按周期执行', '🩺', 90, 29), C('宠物', '宠物疫苗接种', '猫三联/狂犬疫苗按年接种', '💉', 365, 111),
      C('花草', '浇水', '', '🚿', 3, 4), C('花草', '施肥', '', '🌱', 30, 9)
    ],
    stock: [
      S('厨房', '大米', '🍚', 2, 1, '袋'), S('厨房', '食用油', '🫒', 2, 1, '桶'), S('厨房', '盐', '🧂', 2, 1, '袋'), S('厨房', '酱油', '🫙', 1, 1, '瓶'),
      S('日耗', '抽纸', '🧻', 3, 2, '包'), S('日耗', '卷纸', '🧻', 1, 2, '提'), S('日耗', '垃圾袋', '🗑️', 2, 1, '卷'),
      S('清洁', '洗衣液', '🧴', 1, 1, '瓶'), S('清洁', '洗洁精', '🫧', 2, 1, '瓶'), S('清洁', '洗衣粉', '📦', 0, 1, '袋'),
      S('个护', '牙膏', '🪥', 2, 1, '支'), S('个护', '洗发水', '🧴', 1, 1, '瓶'),
      S('宠物', '猫砂', '🐱', 1, 1, '袋'), S('宠物', '猫粮', '🐟', 2, 1, '袋')
    ],
    food: [
      F('牛奶', '🥛', 4, '盒', 2), F('酸奶', '🍶', 3, '杯', 5), F('吐司面包', '🍞', 1, '袋', 1), F('薯片', '🥔', 2, '包', 40),
      F('坚果混合装', '🥜', 5, '袋', 120), F('方便面', '🍜', 4, '包', 90), F('巧克力', '🍫', 2, '块', -1), F('苹果', '🍎', 6, '个', 9)
    ],
    wear: [
      W('上衣', '白色T恤', '夏', '短袖', 5, '白'), W('上衣', '条纹T恤', '春', '短袖', 2, '蓝白'), W('上衣', '基础打底衫', '秋', '长袖', 4, '黑'),
      W('上衣', '针织毛衣', '冬', '毛衣', 3, '米'), W('上衣', '连帽卫衣', '秋', '卫衣', 3, '灰'), W('上衣', '衬衫', '四季', '衬衫', 4, '蓝'),
      W('裤子', '牛仔裤', '四季', '牛仔裤', 3, '蓝'), W('裤子', '运动短裤', '夏', '短裤', 3, '黑'), W('裤子', '休闲长裤', '春', '长裤', 2, '卡其'), W('裤子', '加绒裤', '冬', '长裤', 2, '黑'),
      W('裙子', '碎花连衣裙', '夏', '', 2, '粉'), W('裙子', '百褶半身裙', '春', '', 1, '黑'),
      W('外套', '羽绒服', '冬', '羽绒服', 2, '黑'), W('外套', '风衣', '秋', '风衣', 1, '卡其'), W('外套', '薄夹克', '春', '', 1, '军绿'),
      W('鞋子', '白色板鞋', '四季', '板鞋', 1, '白'), W('鞋子', '运动鞋', '四季', '运动鞋', 2, '灰'), W('鞋子', '凉鞋', '夏', '凉鞋', 2, ''), W('鞋子', '短靴', '冬', '靴子', 1, '黑'),
      W('袜子内衣', '短袜', '四季', '', 12, ''), W('配饰', '围巾', '冬', '', 2, '')
    ]
  };
}
let S = load();
function load() { try { const d = JSON.parse(localStorage.getItem(KEY)); if (d && d.chores) { d.settings = { ...DEF_SET, ...d.settings }; return d; } } catch (e) { } return seed(); }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { } }

/* ============ UI 状态 ============ */
const ui = { tab: 'home', home: 'today', freq: 'all', life: 'stock', stockCat: 'all', wearType: 'all', wearSeason: 'all' };
const find = (arr, id) => S[arr].find(x => x.id === id);

/* ============ 家务计算 ============ */
const nextDue = c => addDays(c.last, c.every);
const daysLeft = c => diff(nextDue(c), today());
const isDue = c => daysLeft(c) <= 0;
const freqGroup = c => c.every <= 1 ? 'day' : c.every <= 7 ? 'week' : 'long';
const freqLabel = n => ({ 1: '每天', 7: '每周', 14: '每两周', 30: '每月', 90: '每季度', 365: '每年' }[n] || `每 ${n} 天`);
function badge(d, label) {
  if (d < 0) return `<span class="badge r">${label || '逾期'} ${-d} 天</span>`;
  if (d === 0) return `<span class="badge o">${label ? label : '今天'}${label ? ' 今天' : ''}</span>`;
  if (d <= 3) return `<span class="badge y">${d} 天后</span>`;
  return `<span class="badge">${d} 天后</span>`;
}
const lowStock = () => S.stock.filter(s => s.qty <= s.min);
const remindDays = c => c.remind ?? (c.every >= 7 ? 1 : 0);   // 定期清洁类默认提前 1 天
const foodRemind = f => f.remind ?? 3;
const rmOn = x => x.rm !== '关';
const soonFood = () => S.food.filter(f => diff(f.expire, today()) <= foodRemind(f));
function alerts() {
  if (S.settings.notify === false) return [];
  const out = [];
  S.chores.forEach(c => { if (!rmOn(c)) return; const d = daysLeft(c); if (d <= remindDays(c)) out.push({ k: 'chore', it: c, d }); });
  S.food.forEach(f => { if (!rmOn(f)) return; const d = diff(f.expire, today()); if (d <= foodRemind(f)) out.push({ k: 'food', it: f, d }); });
  return out.sort((a, b) => a.d - b.d);
}
const rmTag = (on, n, unit) => !on ? '🔕 不提醒' : `🔔 ${n ? '提前 ' + n + ' 天' : unit}`;
const wearTotal = () => S.wear.reduce((a, b) => a + (+b.qty || 0), 0);
function curSeason() { const m = new Date().getMonth() + 1; return m >= 3 && m <= 5 ? '春' : m <= 8 && m >= 6 ? '夏' : m >= 9 && m <= 11 ? '秋' : '冬'; }

/* ============ 渲染 ============ */
function render() {
  $('#title').textContent = { home: '家庭', life: '生活', me: '我的' }[ui.tab];
  renderBanner(); renderHint(); renderRail(); renderMain(); renderTabs(); renderBell();
  $('#fab').style.display = ui.tab === 'me' ? 'none' : '';
}
function renderBell() {
  const n = alerts().length, e = $('#bn');
  e.textContent = n; e.style.display = n ? '' : 'none';
  try { n ? navigator.setAppBadge && navigator.setAppBadge(n) : navigator.clearAppBadge && navigator.clearAppBadge(); } catch (x) { }
}
function renderBanner() {
  let t = '家中一切井然有序 ✨', n = '', u = '';
  if (ui.tab === 'home') {
    const total = S.chores.length, over = S.chores.filter(c => daysLeft(c) < 0).length;
    n = total ? Math.round(100 * (total - over) / total) : 100; u = '分';
    t = over === 0 ? '家中一切井然有序 ✨' : over <= 3 ? `还有 ${over} 项逾期，动一动 💪` : `${over} 项逾期，该收拾啦 🧹`;
  } else if (ui.tab === 'life') {
    if (ui.life === 'stock') { n = lowStock().length; u = '件待补'; t = n ? '有东西快用完啦 🛒' : '囤货充足，安心 ✨'; }
    else if (ui.life === 'food') { n = soonFood().length; u = '件快过期'; t = n ? '记得尽快吃掉 😋' : '食物都很新鲜 ✨'; }
    else { n = wearTotal(); u = '件'; t = `当前是${curSeason()}季，衣橱一览 👗`; }
  } else { t = '记录越多，人生越井井有条'; n = S.chores.length + S.stock.length + S.food.length + S.wear.length; u = '条记录'; }
  $('#banner').innerHTML = `<b class="t">${t}</b><span class="n">${n}<small>${u}</small></span>`;
}
function renderHint() {
  const h = $('#hint');
  if (S.hintOff) { h.style.display = 'none'; return; }
  h.style.display = 'flex';
  h.innerHTML = `<span>💡 当前数据为内置示例，仅做参考；可随意修改删除</span><button data-act="hint">×</button>`;
}
function railItem(id, icon, label, color, on, badgeN) {
  return `<button class="ri ${on ? 'on' : ''}" data-act="rail" data-id="${id}"><span class="ic" style="background:${color}">${icon}${badgeN ? `<em class="bd" style="font-style:normal">${badgeN}</em>` : ''}</span>${label}</button>`;
}
function renderRail() {
  const r = $('#rail');
  r.style.display = ui.tab === 'me' ? 'none' : '';
  if (ui.tab === 'home') {
    const due = S.chores.filter(isDue).length;
    r.innerHTML = railItem('today', '📅', '今日', '#d9f1e6', ui.home === 'today', due) + railItem('all', '📋', '全部', '#e8eefc', ui.home === 'all', 0) +
      ROOMS.map(([n, e, c]) => railItem(n, e, n, c, ui.home === n, S.chores.filter(x => x.room === n && daysLeft(x) < 0).length)).join('');
  } else if (ui.tab === 'life') {
    r.innerHTML = railItem('stock', '📦', '囤货', '#fde6cf', ui.life === 'stock', lowStock().length) +
      railItem('food', '🍪', '零食', '#ffe9ef', ui.life === 'food', soonFood().length) +
      railItem('wear', '👗', '衣橱', '#e5dcf6', ui.life === 'wear', 0);
  }
}
function renderTabs() {
  $('#tabs').innerHTML = [['home', '🏠', '家庭'], ['life', '😊', '生活'], ['me', '👤', '我的']].map(([k, i, l]) =>
    `<button class="${ui.tab === k ? 'on' : ''}" data-act="tab" data-id="${k}"><i>${i}</i>${l}</button>`).join('');
}
function renderMain() {
  const m = $('#main'); const top = m.scrollTop;
  m.innerHTML = ui.tab === 'home' ? viewHome() : ui.tab === 'life' ? (ui.life === 'stock' ? viewStock() : ui.life === 'food' ? viewFood() : viewWear()) : viewMe();
  m.scrollTop = top;
}
const chips = (items, cur, act, flat) => `<div class="chips ${flat ? 'flat' : ''}">${items.map(([id, ic, lb]) => `<button class="chip ${cur === id ? 'on' : ''}" data-act="${act}" data-id="${id}">${ic ? `<i>${ic}</i>` : ''}${lb}</button>`).join('')}</div>`;

/* ---- 家庭 ---- */
function choreCard(c) {
  const d = daysLeft(c);
  return `<div class="card" data-id="${c.id}">
    <div class="ico">${esc(c.emoji || '🧹')}</div>
    <div class="info" data-act="edit-chore" data-id="${c.id}"><b>${esc(c.name)}</b>
      <small>${freqLabel(c.every)} · 上次 ${c.last.slice(5)}</small><small>${rmTag(rmOn(c), remindDays(c), '当天提醒')}</small>${c.note ? `<small>${esc(c.note)}</small>` : ''}</div>
    <div class="side">${badge(d)}</div>
    <button class="check" data-act="done" data-id="${c.id}">✓</button></div>`;
}
function viewHome() {
  const f = ui.freq, fl = c => f === 'all' || freqGroup(c) === f;
  const freqChips = chips([['all', '', '全部'], ['day', '', '每天'], ['week', '', '每周'], ['long', '', '更久']], f, 'freq', true);
  if (ui.home === 'today') {
    const due = S.chores.filter(c => isDue(c) && fl(c)).sort((a, b) => daysLeft(a) - daysLeft(b));
    const week = S.chores.filter(c => { const d = daysLeft(c); return d > 0 && d <= 7 && fl(c); }).sort((a, b) => daysLeft(a) - daysLeft(b));
    return `<div class="hd"><h2>今日待办</h2><span>${due.length} 项待办</span></div>${freqChips}
      ${due.length ? due.map(choreCard).join('') : '<div class="empty">🎉 今天的家务都做完了<br>休息一下吧</div>'}
      ${week.length ? `<div class="sec">本周接下来 · ${week.length} 项</div>${week.map(choreCard).join('')}` : ''}`;
  }
  const list = S.chores.filter(c => (ui.home === 'all' || c.room === ui.home) && fl(c)).sort((a, b) => daysLeft(a) - daysLeft(b));
  const ok = list.filter(c => daysLeft(c) > 0).length;
  return `<div class="hd"><h2>${ui.home === 'all' ? '全部家务' : ui.home}</h2><span>${list.length} 项 · ${ok} 项良好</span></div>${freqChips}
    ${list.length ? list.map(choreCard).join('') : '<div class="empty">这里还没有家务<br>点右下角 + 添加</div>'}`;
}

/* ---- 囤货 ---- */
function viewStock() {
  const cats = [['all', '📦', '全部'], ...STOCK_CATS.map(([n, e]) => [n, e, n])];
  const list = S.stock.filter(s => ui.stockCat === 'all' || s.cat === ui.stockCat).sort((a, b) => (a.qty <= a.min ? 0 : 1) - (b.qty <= b.min ? 0 : 1));
  const low = lowStock().length;
  return `<div class="hd"><h2>囤货</h2><button class="pill" data-act="shoplist">🛒 补货清单${low ? ` (${low})` : ''}</button></div>${chips(cats, ui.stockCat, 'stockcat')}
    ${list.map(s => {
      const isLow = s.qty <= s.min;
      return `<div class="card"><div class="ico">${esc(s.emoji || '📦')}</div>
      <div class="info" data-act="edit-stock" data-id="${s.id}"><b>${esc(s.name)}</b>
        <small class="${isLow ? 'warn' : ''}">${isLow ? `只剩 ${s.qty}${esc(s.unit)}，该补货了` : `低于 ${s.min} ${esc(s.unit)}提醒`}</small></div>
      <div class="stepper"><button class="m" data-act="stock-" data-id="${s.id}">−</button><span class="q ${isLow ? 'low' : ''}">${s.qty}</span><button class="p" data-act="stock+" data-id="${s.id}">+</button></div></div>`;
    }).join('') || '<div class="empty">还没有囤货记录<br>点右下角 + 添加</div>'}`;
}

/* ---- 零食 ---- */
function viewFood() {
  const list = [...S.food].sort((a, b) => a.expire.localeCompare(b.expire));
  return `<div class="hd"><h2>零食 · 食品</h2><span>${S.food.length} 种 · 按过期时间排序</span></div>
    ${list.map(f => {
      const d = diff(f.expire, today());
      return `<div class="card"><div class="ico">${esc(f.emoji || '🍪')}</div>
      <div class="info" data-act="edit-food" data-id="${f.id}"><b>${esc(f.name)} <span style="color:var(--g2)">×${f.qty}${esc(f.unit || '')}</span></b>
        <small class="${d < 0 ? 'warn' : ''}">保质期至 ${f.expire}</small><small>${rmTag(rmOn(f), foodRemind(f), '当天提醒')}</small></div>
      <div class="side">${d < 0 ? `<span class="badge r">已过期 ${-d} 天</span>` : d === 0 ? '<span class="badge o">今天过期</span>' : badge(d).replace('天后', '天后过期')}</div>
      <button class="eat" data-act="eat" data-id="${f.id}">🍽 吃掉</button></div>`;
    }).join('') || '<div class="empty">零食柜空空的<br>点右下角 + 添加</div>'}`;
}

/* ---- 衣橱 ---- */
function viewWear() {
  const cs = curSeason();
  const inSeason = s => S.wear.filter(w => w.season === s || (s !== '四季' && w.season === '四季')).reduce((a, b) => a + (+b.qty || 0), 0);
  const tiles = SEASONS.map(s => `<div class="tile ${s === cs ? 'now' : ''}">${s}<b>${s === '四季' ? S.wear.filter(w => w.season === '四季').reduce((a, b) => a + (+b.qty || 0), 0) : inSeason(s)}</b></div>`).join('');
  const typeCnt = t => S.wear.filter(w => w.type === t).reduce((a, b) => a + (+b.qty || 0), 0);
  const types = [['all', '👚', `全部 ${wearTotal()}`], ...WEAR_TYPES.map(([n, e]) => [n, e, `${n} ${typeCnt(n)}`])];
  const seasons = [['all', '', '全季节'], ...SEASONS.map(s => [s, '', s])];
  const list = S.wear.filter(w => (ui.wearType === 'all' || w.type === ui.wearType) &&
    (ui.wearSeason === 'all' || w.season === ui.wearSeason || (ui.wearSeason !== '四季' && w.season === '四季')));
  const emo = t => (WEAR_TYPES.find(x => x[0] === t) || [0, '👕'])[1];
  return `<div class="hd"><h2>衣橱</h2><span>共 ${wearTotal()} 件 · ${S.wear.length} 款</span></div>
    <div class="tiles">${tiles}</div><div class="sec" style="margin-top:0;font-size:12px">↑ 各季可穿件数（含四季款，当前季有框）</div>
    ${chips(types, ui.wearType, 'weartype')}${chips(seasons, ui.wearSeason, 'wearseason', true)}
    ${list.map(w => `<div class="card"><div class="ico">${emo(w.type)}</div>
      <div class="info" data-act="edit-wear" data-id="${w.id}"><b>${esc(w.name)}</b>
        <small>${[w.season, w.sub, w.color, w.type].filter(Boolean).map(esc).join(' · ')}</small></div>
      <div class="stepper sm"><button class="m" data-act="wear-" data-id="${w.id}">−</button><span class="q">${w.qty}</span><button class="p" data-act="wear+" data-id="${w.id}">+</button></div></div>`).join('') ||
    '<div class="empty">没有符合条件的衣物<br>点右下角 + 添加</div>'}`;
}

  <div class="card"><div class="line">家务任务<span>${S.chores.length} 项</span></div><div class="line">囤货物品<span>${S.stock.length} 种</span></div>
    <div class="line">零食食品<span>${S.food.length} 种</span></div><div class="line">衣橱<span>${wearTotal()} 件 / ${S.wear.length} 款</span></div></div>

/* ============ 弹层 & 表单 ============ */
const mask = $('#mask'), sheet = $('#sheet');
function openSheet(html) { sheet.innerHTML = html; mask.classList.add('show'); sheet.scrollTop = 0; }
function closeSheet() { mask.classList.remove('show'); }
mask.addEventListener('click', e => { if (e.target === mask) closeSheet(); });
function fieldHtml(f, v) {
  const val = v ?? f.def ?? '';
  const pre = f.presets ? `<div class="pre">${f.presets.map(([l, x]) => `<button type="button" data-fill="${x}" data-for="${f.k}">${l}</button>`).join('')}</div>` : '';
  let inp;
  if (f.type === 'select') inp = `<select name="${f.k}">${f.opts.map(o => `<option ${o === val ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
  else inp = `<input name="${f.k}" type="${f.type || 'text'}" value="${esc(val)}" ${f.type === 'number' ? 'inputmode="numeric" min="0"' : ''} ${f.list ? 'list="dl-' + f.k + '"' : ''} ${f.req ? 'required' : ''} ${f.max ? 'maxlength=' + f.max : ''} placeholder="${esc(f.ph || '')}">` +
    (f.list ? `<datalist id="dl-${f.k}">${f.list.map(o => `<option value="${o}">`).join('')}</datalist>` : '');
  return `<div class="f"><label>${f.label}</label>${inp}${pre}</div>`;
}
function openForm({ title, fields, data = {}, onSave, onDelete }) {
  const rows = []; let buf = [];
  fields.forEach(f => { if (f.half) { buf.push(f); if (buf.length === 2) { rows.push(buf); buf = []; } } else { if (buf.length) { rows.push(buf); buf = []; } rows.push([f]); } });
  if (buf.length) rows.push(buf);
  const body = rows.map(r => r.length === 2 ? `<div class="row2">${r.map(f => fieldHtml(f, data[f.k])).join('')}</div>` : fieldHtml(r[0], data[r[0].k])).join('');
  openSheet(`<h3>${title}</h3><form id="frm">${body}<div class="btns">${onDelete ? '<button type="button" class="del" id="fdel">删除</button>' : ''}<button type="button" class="cancel" id="fcancel">取消</button><button class="ok">保存</button></div></form>`);
  const frm = $('#frm');
  frm.addEventListener('click', e => { const b = e.target.closest('[data-fill]'); if (b) frm.elements[b.dataset.for].value = b.dataset.fill; });
  $('#fcancel').onclick = closeSheet;
  if (onDelete) $('#fdel').onclick = () => { if (confirm('确定删除吗？')) { onDelete(); closeSheet(); save(); render(); } };
  frm.onsubmit = e => {
    e.preventDefault();
    const out = {};
    fields.forEach(f => { let v = frm.elements[f.k].value.trim(); if (f.type === 'number') v = Math.max(0, parseInt(v, 10) || 0); out[f.k] = v; });
    onSave(out); closeSheet(); save(); render();
  };
}
let toastT;
function toast(msg, undo) {
  const t = $('#toast'); t.innerHTML = `<span>${msg}</span>${undo ? '<button id="undo">撤销</button>' : ''}`; t.classList.add('show');
  if (undo) $('#undo').onclick = () => { undo(); save(); render(); t.classList.remove('show'); };
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3500);
}

function shopList() {
  const l = lowStock();
  const txt = l.length ? l.map(s => `□ ${s.name}（现有 ${s.qty}${s.unit}）`).join('\n') : '🎉 目前没有需要补货的东西';
  openSheet(`<h3>🛒 补货清单</h3><div class="list-txt">${esc(txt)}</div><div class="btns"><button class="cancel" id="fcancel">关闭</button>${l.length ? '<button class="ok" id="cp">复制清单</button>' : ''}</div>`);
  $('#fcancel').onclick = closeSheet;
  if (l.length) $('#cp').onclick = () => { (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast('已复制，去买买买 🛍️'), () => toast('复制失败，请手动长按选择')); closeSheet(); };
}

/* ============ 动作 & 提醒 ============ */
function doneChore(id) {
  const c = find('chores', id), old = c.last; c.last = today(); save(); render();
  toast(`✅ 已完成「${c.name}」`, () => { c.last = old; });
}
function eatFood(id) {
  const f = find('food', id), idx = S.food.indexOf(f), q = f.qty;
  if (q <= 1) { S.food.splice(idx, 1); save(); render(); toast(`😋 「${f.name}」吃完啦`, () => { S.food.splice(idx, 0, f); }); }
  else { f.qty--; save(); render(); toast(`😋 吃掉一份「${f.name}」`, () => { f.qty = q; }); }
}
function alertText(a) {
  const d = a.d;
  if (a.k === 'chore') return d < 0 ? [`逾期 ${-d} 天`, 'r'] : d === 0 ? ['今天要做', 'o'] : [`${d} 天后要做`, ''];
  return d < 0 ? [`已过期 ${-d} 天`, 'r'] : d === 0 ? ['今天过期', 'o'] : [`${d} 天后过期`, ''];
}
function openAlerts() {
  const l = alerts();
  const rows = l.map(a => { const [t, c] = alertText(a); const ch = a.k === 'chore';
    return `<div class="al"><span class="ae">${esc(a.it.emoji || (ch ? '🧹' : '🍪'))}</span><div><b>${esc(a.it.name)}</b><small class="${c}">${ch ? '家务' + (a.it.room ? ' · ' + esc(a.it.room) : '') : '零食'} · ${t}</small></div>
      <button data-act="${ch ? 'al-done' : 'al-eat'}" data-id="${a.it.id}">${ch ? '✓ 做完了' : '🍽 吃掉'}</button></div>`; }).join('');
  openSheet(`<h3>🔔 到期提醒${l.length ? ` · ${l.length} 件` : ''}</h3>${rows || '<div class="empty">🎉 暂时没有需要提醒的事</div>'}<div class="btns" style="margin-top:14px"><button class="cancel" id="fcancel">关闭</button></div>`);
  $('#fcancel').onclick = closeSheet;
}
function permState() { return typeof Notification === 'undefined' ? '不支持' : { granted: '已允许', denied: '已拒绝', default: '点击开启' }[Notification.permission]; }
// 每天第一次打开：弹出提醒列表 + 系统通知
function dailyRemind() {
  if (document.hidden || S.settings.lastRemind === today()) return;
  const l = alerts(); if (!l.length) return;
  S.settings.lastRemind = today(); save(); openAlerts();
  try { if (typeof Notification !== 'undefined' && Notification.permission === 'granted') new Notification('井井有条 · 今日提醒', { body: l.slice(0, 4).map(a => `${a.it.name}（${alertText(a)[0]}）`).join('、') + (l.length > 4 ? ` 等 ${l.length} 件` : '') }); } catch (x) { }
}
/* ---- 导出到日历（.ics）---- */
function exportIcs() {
  const hour = S.settings.hour, t = today(), now = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  const ymd = s => s.replace(/-/g, ''), tx = s => String(s).replace(/([,;\\])/g, '\\$1').replace(/\n/g, '\\n');
  const trig = days => { const off = hour * 60 - days * 1440, a = Math.abs(off), d = Math.floor(a / 1440), h = Math.floor(a % 1440 / 60); return (off < 0 ? '-' : '') + 'P' + (d ? d + 'D' : '') + 'T' + h + 'H'; };
  const ev = (id, title, desc, start, rrule, days) => ['BEGIN:VEVENT', `UID:${id}@jjyt`, `DTSTAMP:${now}`, `DTSTART;VALUE=DATE:${ymd(start)}`, `DTEND;VALUE=DATE:${ymd(addDays(start, 1))}`,
    ...(rrule ? ['RRULE:' + rrule] : []), `SUMMARY:${tx(title)}`, `DESCRIPTION:${tx(desc)}`, 'BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${tx(title)}`, `TRIGGER;RELATED=START:${trig(days)}`, 'END:VALARM', 'END:VEVENT'];
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//jingjingyoutiao//CN', 'CALSCALE:GREGORIAN', 'X-WR-CALNAME:井井有条'];
  let n = 0;
  S.chores.filter(rmOn).forEach(c => {
    const nd = nextDue(c), start = nd < t ? t : nd, e = c.every;
    const rule = e % 7 === 0 ? `FREQ=WEEKLY;INTERVAL=${e / 7}` : `FREQ=DAILY;INTERVAL=${e}`;
    lines.push(...ev('c' + c.id, `${c.emoji || '🧹'} ${c.name}`, `${c.room || ''} ${freqLabel(e)}${c.note ? ' · ' + c.note : ''}`, start, rule, remindDays(c))); n++;
  });
  S.food.filter(rmOn).forEach(f => {
    if (f.expire < t) return;
    lines.push(...ev('f' + f.id, `${f.emoji || '🍪'} ${f.name} 快过期了`, `保质期至 ${f.expire}，剩 ${f.qty}${f.unit || ''}，记得吃掉`, f.expire, '', foodRemind(f))); n++;
  });
  lines.push('END:VCALENDAR');
  const b = new Blob([lines.join('\r\n')], { type: 'text/calendar;charset=utf-8' }), x = document.createElement('a');
  x.href = URL.createObjectURL(b); x.download = '井井有条提醒.ics'; x.click(); setTimeout(() => URL.revokeObjectURL(x.href), 2000);
  toast(`已导出 ${n} 条提醒，打开文件导入日历`);
}

/* ============ 事件 ============ */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  const clamp = (o, k, d) => { const old = o[k]; o[k] = Math.max(0, (+o[k] || 0) + d); return old; };
  switch (a) {
    case 'tab': ui.tab = id; break;
    case 'rail': ui.tab === 'home' ? ui.home = id : ui.life = id; break;
    case 'freq': ui.freq = id; break;
    case 'stockcat': ui.stockCat = id; break;
    case 'weartype': ui.wearType = id; break;
    case 'wearseason': ui.wearSeason = id; break;
    case 'hint': S.hintOff = true; save(); break;
    case 'done': doneChore(id); return;
    case 'al-done': doneChore(id); openAlerts(); return;
    case 'al-eat': eatFood(id); openAlerts(); return;
    case 'bell': openAlerts(); return;
    case 'toggle-notify': S.settings.notify = S.settings.notify === false; save(); break;
    case 'perm':
      if (typeof Notification === 'undefined') toast('此浏览器不支持系统通知，请用日历提醒');
      else Notification.requestPermission().then(render);
      return;
    case 'ics': exportIcs(); return;
    case 'stock+': clamp(find('stock', id), 'qty', 1); save(); break;
    case 'stock-': clamp(find('stock', id), 'qty', -1); save(); break;
    case 'wear+': clamp(find('wear', id), 'qty', 1); save(); break;
    case 'wear-': clamp(find('wear', id), 'qty', -1); save(); break;
    case 'eat': eatFood(id); return;
    case 'edit-chore': choreForm(find('chores', id)); return;
    case 'edit-stock': stockForm(find('stock', id)); return;
    case 'edit-food': foodForm(find('food', id)); return;
    case 'edit-wear': wearForm(find('wear', id)); return;
    case 'shoplist': shopList(); return;
    case 'add':
      if (ui.tab === 'home') choreForm(); else ui.life === 'stock' ? stockForm() : ui.life === 'food' ? foodForm() : wearForm();
      return;
    case 'export': {
      const b = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' }), x = document.createElement('a');
      x.href = URL.createObjectURL(b); x.download = `井井有条-${today()}.json`; x.click(); setTimeout(() => URL.revokeObjectURL(x.href), 2000); return;
    }
    case 'import': $('#file').click(); return;
    case 'seed': if (confirm('用示例数据覆盖当前所有数据？')) { S = seed(); save(); } break;
    case 'clear': if (confirm('清空所有数据？此操作不可恢复（建议先导出备份）')) { S = { hintOff: true, settings: { ...DEF_SET }, chores: [], stock: [], food: [], wear: [] }; save(); } break;
  }
  render();
});
document.addEventListener('change', e => {
  if (e.target.id === 'hourSel') { S.settings.hour = +e.target.value; save(); return; }
  if (e.target.id !== 'file') return;
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { try { const d = JSON.parse(r.result); if (!d.chores) throw 0; S = { hintOff: true, chores: [], stock: [], food: [], wear: [], ...d }; S.settings = { ...DEF_SET, ...S.settings }; save(); render(); toast('导入成功 ✅'); } catch (x) { alert('文件格式不对，导入失败'); } };
  r.readAsText(f);
});
// 回到前台时刷新（跨天后徽标、倒计时自动更新）
document.addEventListener('visibilitychange', () => { if (!document.hidden) { render(); dailyRemind(); } });

render();
dailyRemind();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => { });
</script>
</body>
</html>
